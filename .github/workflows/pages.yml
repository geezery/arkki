name: Homepage

# Publishes site/ (plus the images in docs/assets) to GitHub Pages:
# https://geezery.github.io/arkki/
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the homepage
        # The page is self-contained: nothing may load from another host, and every local file it names must exist.
        run: |
          cd site
          if grep -nE '(src|href)="https?://[^"]+\.(js|css|woff2?|png|jpg|svg)"' index.html \
              | grep -v 'rel="canonical"'; then
            echo "::error::index.html loads a file from another host."; exit 1
          fi
          missing=0
          for f in $(grep -oE '(src|href)="[^"#:]+"|url\([^):]+\)' index.html | sed -E 's/^(src|href)="//; s/^url\(//; s/[")]$//' | sort -u); do
            case "$f" in assets/*) [ -f "../docs/$f" ] || { echo "::error::Missing docs/$f"; missing=1; } ;;
                         *) [ -f "$f" ] || { echo "::error::Missing site/$f"; missing=1; } ;;
            esac
          done
          exit $missing

      - name: Assemble
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp docs/assets/*.png docs/assets/*.svg _site/assets/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
